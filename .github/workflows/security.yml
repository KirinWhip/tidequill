name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (records which npm packages ship inside the app)
        run: npm run build
      - name: npm audit (report all findings, fail on high/critical in shipped code)
        run: |
          npm audit --json > audit.json || true
          node scripts/audit-gate.mjs audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit
          path: audit.json
          if-no-files-found: warn
