name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build Windows installer + portable (also produces release/win-unpacked)
        run: npm run dist:win -- --publish never
      - name: E2E (Playwright _electron against packaged exe)
        run: npx playwright test
        env:
          CI: 'true'
      - name: Upload E2E report & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-windows
          path: |
            playwright-report/
            test-results/
            screenshots/p0/
          if-no-files-found: warn
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist-release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.exe
          generate_release_notes: true
